open_btn = "<qt>Open a TOML parameters file or the video file to track. Select multiple video files to track them as if they were concatenated. This is intended for consecutive clips of the same experiment."
open_path_label = "<qt>Current video path to be tracked"
open_path_list = "<qt>List of video paths in the order they are going to be tracked. Click on one of them to set the video player to its beginning. Drag and drop to reorder"
tracking_interval = "<qt>Set the time interval(s) to track (in units of frames). Frames outside the specified ranges will be neglected"
region_of_interest = "<qt>Define an area on the video for idtrackerai to look for or ignore blobs. Click 'Add' to select the region type and define the contour on the video player (the right click erases points). Drag and drop to reorder existing ROIs."
exclusive_rois = "<qt>Set the regions of interest as exclusive. This will restrict identities within each of the regions. Distinct ROIs will appear outlined with different colors."
background_subtraction = "<qt>Compute the video background and use it together with 'Background difference threshold' to detect blobs"
background_stat = "<qt>Select the method for background computation.<ul><li>'Custom' to load an existing background image</li></ul>For other options, a subset of frames from the video is sampled and processed with the following options:<ul><li>'Median' (default) works well in most cases</li><li>'Mean' was the default in version 4</li><li>'Max' is recommended for dark animals on bright backgrounds</li><li>'Min' for bright animals on dark backgrounds</li></ul>"
background_view = "<qt>View the computed background"
number_of_animals = "<qt>Insert the number of animals appearing in the video"
check_segm = "<qt>If checked, idtrackerai will exit if frames with more blobs than animals are found. If not checked, idtracker.ai will only emit a warning about those frames and it will go on"
area_thresholds = "<qt>Set the valid blob area range. Smaller or larger blobs will be ignored. Check 'Upper limit' to set a maximum value, otherwise it is 'inf'"
intensity_thresholds_nobkg = "<qt>Defines the valid blob's brightness range (0 to 255). Clusters of pixels within this range will form a blob. \"Dark animals\" sets the range from 0 to the specified value, \"Bright animals\" from the specified value to 255, and \"Custom\" defines a double-valued range."
intensity_thresholds_yesbkg = "<qt>Set the brightness difference threshold between pixels and the background. Blobs are formed by pixels exceeding this threshold."
track_wo_id = "<qt>If checked, idtracker.ai will skip identification and assign random identities to blobs"
save_params = "<qt>Save the tracking parameters to a .TOML file for future use or tracking from the terminal"
close_and_track = "<qt>Close the app and start tracking in the terminal"
blobs_info = "<qt>Bar plot of the detected blob's areas"
session_name = "<qt>Name the session. The output folder will be 'session_' followed by this name."
detectron2_enhancement = "<qt>Image preparation for the Detectron2 model. Enhancement is a property of a recording setup, not of the software: a well lit tank may need none, a turbid one under uneven lighting may need strong CLAHE. Judge it against the video on the right, using the raw/enhanced slider to compare, then save it as this setup's profile. The same profile is used when frames are sampled for annotation and again at inference, so the model always sees the same kind of image."
segmentation_source = "<qt>Choose how animals are found in each frame.<ul><li>'Thresholding' is idtracker.ai's own segmentation, driven by the intensity and area thresholds below</li><li>'Detectron2 pipeline' prepares a model: the thresholding controls are hidden because nothing in that mode segments by threshold. 'External contours' reads outlines precomputed by another model, such as a fine-tuned Detectron2 Mask R-CNN. The intensity thresholds and background subtraction take no part and are disabled; the area thresholds still filter stray detections</li></ul>Everything after segmentation is unchanged: crossing detection, fragmentation and identification run exactly as before."
external_contours = "<qt>Load an .h5 contour file produced by tools/detectron2_export_contours.py. It is checked against the loaded video, and the file's own record of the model and thresholds that made it is shown as a tooltip."
enhancement = "<qt><b>Frame enhancement</b><br><br>Cleans up the picture before anything looks at it. Applied to the frames, to the background model, to the identification images and to the Detectron2 pipeline alike, so what you see here is exactly what gets segmented.<br><br>It belongs to the <i>recording setup</i>, not to the software: a well lit tank may need none, a turbid one under uneven lighting may need a lot. Judge it against your own video with the wipe slider, then save it so every clip from that rig is prepared identically."
enhancement_preset = "<qt>How hard to work on the image.<ul><li><b>None</b> &ndash; use the frames as they are. Right for well lit, high-contrast footage.</li><li><b>Gentle</b> &ndash; mild contrast lift. A good first try.</li><li><b>Standard</b> &ndash; the usual choice for tank footage with some lighting gradient.</li><li><b>Strong</b> &ndash; for low contrast or turbid water. Can start to show blocky texture.</li><li><b>Custom</b> &ndash; reveals the individual controls below.</li></ul>Every preset except None also flattens uneven lighting."
enhancement_compare = "<qt>Wipe between the original and the enhanced image, to judge the effect.<br><br>Drag left to reveal more of the original, right for more of the enhanced version. It changes only what is displayed, never what is saved or segmented.<br><br>The animals may sit on one side of the frame, so move the wipe across before deciding."
enhancement_save = "<qt>Save these settings as this recording setup&rsquo;s profile.<br><br>Reuse it for every clip from the same rig. It travels with the annotations into training and inference, so the model always sees the same kind of image."
enhancement_load = "<qt>Load a setup profile saved earlier, or one written beside a folder of sampled frames."
enhancement_contrast = "<qt><b>Contrast boost</b> (CLAHE clip limit)<br><br>How much local contrast to add. Higher makes faint animals stand out, but above roughly 3 it also amplifies noise and can produce visible square tiles."
enhancement_detail = "<qt><b>Local detail</b> (CLAHE tile grid)<br><br>How finely the contrast boost is applied. Higher adapts to smaller regions, which helps when brightness varies across the tank, but makes tile edges more likely. 8 suits most footage."
enhancement_evenness = "<qt><b>Lighting evenness</b> (blur radius, in pixels)<br><br>Removes gradual brightness gradients, such as one side of the tank being brighter than the other. Should be comfortably larger than an animal: too small and the animals are treated as background and fade out. If they start disappearing, raise this."
d2_video_list = "<qt><b>Videos to sample from</b><br><br>The clips the model will be trained on. This is deliberately <i>not</i> the video you are tracking: a model should see every recording from a setup, while a tracking session is one recording. Add all of them here and still track each one separately.<br><br>The summary line underneath counts the clips, how many recordings they group into, and their total length."
d2_add_videos = "<qt>Add individual video files to the annotation set. They do not have to be in the same folder as the one you are tracking."
d2_add_folder = "<qt>Add every video in a folder. macOS &lsquo;._&rsquo; companion files are ignored, so a folder copied from a Mac does not fill the list with unreadable entries."
d2_remove_videos = "<qt>Remove the selected videos from the annotation set. Nothing on disk is touched, and frames already sampled from them are kept."
d2_reset_videos = "<qt>Replace the list with whatever videos are currently open in the Segmentation App, discarding any additions made here."
d2_preview = "<qt>What the next run would do, worked out without reading a single frame.<br><br>Watch for a warning that some videos would get no frames: that happens when the total is smaller than the number of clips, and it defeats the point of annotating across a collection."
d2_group_by = "<qt><b>Train/validation split</b><br><br>Whole groups of clips go to one side or the other, never split down the middle.<br><br><b>By recording</b> folds the pieces of one recording together, guessing from the file names &ndash; B3_N1_segment_1, _2 and _3 become one recording. They show the same animals in the same arena minutes apart, so testing on one after training on another measures memorisation.<br><br><b>By file</b> treats every clip separately. Use it when clips that look like segments really are independent recordings.<br><br><b>Random</b> splits frame by frame and will flatter the model.<br><br>The line below shows the grouping that was worked out, so you can check it before building."
d2_n_frames = "<qt>How many frames to pull out for annotation, across all loaded videos in proportion to their length.<br><br>A few hundred is typical. More frames means more annotation work but a model that generalises better across the recording."
d2_seed = "<qt><b>Selection number</b><br><br>Which set of frames you get.<br><br>Frames are chosen by cutting each clip into equal blocks and taking one frame from each, so the whole recording is covered rather than one clump of it. This number fixes that choice: the same number always gives the same frames, which makes a sampling run reproducible and describable in a methods section.<br><br>Change it only when you want a <i>different</i> set &ndash; for example a second batch to add to one you have already annotated."
d2_frames_folder = "<qt>Where the sampled frames are written. LabelMe saves its annotations here too, beside each image."
d2_class_name = "<qt>The label given to every animal you outline, for example &lsquo;fish&rsquo;. LabelMe opens with this preloaded and refuses anything else, so a typo cannot quietly become a second class."
d2_labelme = "<qt>Open LabelMe on the sampled frames, ready to annotate. Draw one polygon around each animal. The step header counts how many frames you have finished."
d2_open_folder = "<qt>Open the frames folder in Explorer, if you would rather start LabelMe yourself."
d2_refresh = "<qt>Recount the annotated frames. Use it after annotating, since the count is read from disk."
d2_expected = "<qt>How many animals you expect in each frame. Frames with a different number are flagged in the report, which is how you catch a missed animal. Leave at &lsquo;any&rsquo; to skip the check."
d2_val_fraction = "<qt>How much of the data to hold back for measuring the model rather than training it.<br><br>The split is by source video, not by frame: frames a second apart show the same animals in the same poses, so splitting those at random would let the model be tested on what it had memorised."
d2_dataset_folder = "<qt>Where the COCO dataset is written: train.json, val.json, the images, and a report of everything the validation found."
d2_build = "<qt>Validate every polygon and build the training dataset. The report appears below, listing anything that was dropped and why."
