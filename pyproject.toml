[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
# Renamed from "idtrackerai" so this fork is distinguishable from the
# upstream release. The import name is unchanged, so it cannot be installed
# alongside upstream idtracker.ai in the same environment.
name = "idtrackerai-detectron2"
# Tracks the upstream version this fork is based on, with a local suffix.
version = "6.0.15a0+detectron2.1"
# Only the author of this fork's modifications is listed here. The
# idtracker.ai authors are credited in NOTICE, README.md and CITATION.cff;
# naming them in package metadata would suggest they maintain this fork or
# accept contact about it, which they do not.
authors = [
    { name = "Martina Bellio" },
]
description = "A fork of idtracker.ai that accepts animal outlines from an external instance-segmentation model, such as a fine-tuned Detectron2 Mask R-CNN, in place of intensity thresholding. Not affiliated with or endorsed by the de Polavieja Lab."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy >= 1.26.4",
    "rich >= 13.5.1",
    "h5py >= 3.10.0",
    "scipy >= 1.15.0",
    "opencv-python-headless >= 4.10.0.84", # the first version compatible with NumPy 2.0
    "pyqt6 >= 6.7.0",
    "qtpy >= 2.4.0",
    'superqt >= 0.7.3',                    # QToggleSwitch added in 0.7.3
    'toml >= 0.10.2',
    "matplotlib >= 3.7.0",
    'packaging',
    'psutil >= 6.1.0',
    'scikit-learn >= 1.6.0',
    'requests >= 2.26.0',
    'deprecated >= 1.2.13',
    # Annotation stage of the Detectron2 pipeline. Brings PySide6, which
    # coexists with this package's PyQt6 because LabelMe is launched as a
    # separate process and idtrackerai/__init__.py pins QT_API=pyqt6 before
    # qtpy is imported.
    'labelme >= 7.7.0',
]

[project.optional-dependencies]
dev = [
    'pytest',
    "black[jupyter]",
    'pylint',
    'vulture',
    'isort',
    "twine",
    "build",
    'pre-commit',
]
docs = [
    "pydata_sphinx_theme",
    "sphinx-copybutton",
    "sphinx_design",
    "sphinx",
    "nbsphinx",
    "ipykernel",
    'sphinx-toolbox',
    'sphinx-togglebutton',
    'esbonio',
    'sphinx-favicon',
]

[project.urls]
Repository = "https://github.com/mbel-tech/idtrackerai-detectron2"
Issues = "https://github.com/mbel-tech/idtrackerai-detectron2/issues"
"Upstream project" = "https://gitlab.com/polavieja_lab/idtrackerai"
"Upstream documentation" = "https://idtracker.ai/"

[tool.setuptools.package-data]
idtrackerai = [
    "*/*.toml",
    "*/*/*.toml",
    "GUI_tools/*.svg",
    "GUI_tools/*.dat",
    "data/*.avi",
    "extra_tools/detectron2_pipeline/notebooks/*.ipynb",
]

[project.scripts]
idtrackerai_test = "idtrackerai.start.__main__:general_test"
idtrackerai = "idtrackerai.start.__main__:main"
idtrackerai_validate = "idtrackerai.extra_tools.validator.__init__:idtrackerai_validate_entrypoint"
idtrackerai_video = "idtrackerai.extra_tools.video_generator.__init__:idtrackerai_video_entrypoint"
idtrackerai_format = "idtrackerai.utils.trajectories_io:idtrackerai_format_entrypoint"
idtrackerai_inspect_clusters = "idtrackerai.extra_tools.cluster_inspection:idtrackerai_inspect_clusters_entrypoint"
idtrackerai_background = "idtrackerai.base.animals_detection.segmentation:idtrackerai_background_entrypoint"
idmatcherai = "idtrackerai.extra_tools.idmatcherai:idmatcherai_entrypoint"

# The Detectron2 preparation pipeline. Installed with the package, so they are
# available without cloning the repository.
idtrackerai_d2_enhance = "idtrackerai.extra_tools.detectron2_pipeline.preprocessing:_demo"
idtrackerai_d2_sample = "idtrackerai.extra_tools.detectron2_pipeline.cli:sample_main"
idtrackerai_d2_dataset = "idtrackerai.extra_tools.detectron2_pipeline.cli:dataset_main"
idtrackerai_d2_train = "idtrackerai.extra_tools.detectron2_pipeline.training:main"
idtrackerai_d2_export = "idtrackerai.extra_tools.detectron2_pipeline.inference:main"
idtrackerai_d2_videos = "idtrackerai.extra_tools.detectron2_pipeline.videos:main"
idtrackerai_d2_bundle = "idtrackerai.extra_tools.detectron2_pipeline.bundle:main"
# PyTorch and Detectron2 cannot be ordinary dependencies: PyPI's torch wheel
# for Windows is CPU-only, so declaring it would silently disable the GPU for
# idtracker.ai's own identity tracking, and Detectron2 is not on PyPI at all
# and builds from source. This command installs the right ones for a machine.
idtrackerai_d2_install_gpu = "idtrackerai.extra_tools.detectron2_pipeline.install_gpu:main"
# SAM 3 needs no training of its own, so it joins the pipeline at two points:
# drafting annotations for you to correct, and exporting contours directly.
# The exporter is idtrackerai_d2_export --backend sam3.
idtrackerai_sam3_prelabel = "idtrackerai.extra_tools.detectron2_pipeline.prelabel:main"

[tool.pytest.ini_options]
log_file_format = "%(asctime)s %(levelname)8s %(message)s (%(filename)s:%(lineno)s)"
log_file = 'pytest.log'
log_file_level = 0
addopts = '-v'

# for using Pyright/Pylance with qtpy code
[tool.pyright.defineConstant]
PYQT5 = false
PYSIDE2 = false
PYQT6 = true
PYSIDE6 = false

[tool.black]
skip-magic-trailing-comma = true
target-version = ['py310']

[tool.isort]
profile = "black"

[tool.pylint]
extension-pkg-whitelist = 'qtpy'
generated-members = 'cv2.*, torch.*'
ignore_modules = 'qtpy'
disable = [
    "missing-docstring",
    "fixme",
    "logging-fstring-interpolation",
    "wrong-import-order",
    "invalid-name",
    "no-name-in-module",
]
